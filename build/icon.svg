<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2b29"/>
      <stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shape">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <circle cx="512" cy="530" r="330" fill="url(#glow)"/>

    <!-- estrelas -->
    <g fill="#fff">
      <circle cx="210" cy="230" r="5" opacity=".55"/>
      <circle cx="800" cy="200" r="4" opacity=".45"/>
      <circle cx="850" cy="420" r="3" opacity=".35"/>
      <circle cx="180" cy="560" r="3" opacity=".35"/>
      <circle cx="260" cy="840" r="4" opacity=".4"/>
      <circle cx="780" cy="850" r="5" opacity=".5"/>
      <circle cx="640" cy="160" r="3" opacity=".35"/>
    </g>

    <!-- três universos -->
    <g fill="none" stroke-width="34" style="mix-blend-mode: screen">
      <circle cx="512" cy="415" r="165" stroke="#d97757"/>
      <circle cx="417" cy="580" r="165" stroke="#6a9bcc"/>
      <circle cx="607" cy="580" r="165" stroke="#8fa86c"/>
    </g>

    <!-- planetas -->
    <circle cx="628" cy="298" r="26" fill="#f0a383"/>
    <circle cx="267" cy="650" r="22" fill="#9cc0e3"/>
    <circle cx="742" cy="675" r="24" fill="#b7cc95"/>
  </g>
</svg>
