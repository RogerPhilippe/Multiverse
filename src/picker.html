<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Nova aba</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: #1f1e1d;
      color: #d6d3cd;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 500; color: #fff; }
    #grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      max-width: 480px; /* 2 por linha */
    }
    .service {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 230px;
      height: 60px;
      padding: 0 12px;
      text-align: left;
      border: 1px solid #3a3835;
      border-radius: 12px;
      background: #2a2826;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .service:hover { background: #33312e; border-color: #4a4743; color: #fff; }
    .service:focus-visible { outline: 2px solid #d97757; outline-offset: 2px; }
    .mark {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
    }
    .mark.long { font-size: 12px; }
    .hint { margin: 0; font-size: 12px; color: #8a867f; }
  </style>
</head>
<body>
  <h1>Nova aba</h1>
  <div id="grid"></div>
  <p class="hint">Cada aba é uma conta separada, com login próprio. Esc volta.</p>
  <script src="picker.js"></script>
</body>
</html>
