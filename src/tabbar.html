<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Multiverse</title>
  <style>
    * { box-sizing: border-box; }
    /* A janela inteira é desta página; as abas (páginas) ficam por cima, abaixo
       da barra. Sem página à mostra (aba bloqueada ou diálogo), aparece #panel. */
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: #1f1e1d;
      color: #d6d3cd;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }
    #bar {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 40px;
      padding: 0 8px;
      border-bottom: 1px solid #3a3835;
      -webkit-app-region: drag;
    }
    body.darwin #bar { padding-left: 80px; } /* espaço para os botões da janela no macOS */
    .tab, #add, input, .close { -webkit-app-region: no-drag; }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 220px;
      min-width: 90px;
      height: 32px;
      padding: 0 12px;
      border-radius: 8px 8px 0 0;
      background: #2a2826;
      cursor: default;
    }
    .tab:hover { background: #33312e; }
    .tab.active { background: #3a3835; color: #fff; }
    .tab .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .tab .dot.loading {
      width: 10px; height: 10px; margin: -1px;
      border: 2px solid; border-top-color: transparent !important;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .tab .dot.loading { animation-duration: 2.4s; } }
    .tab .name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #add {
      align-self: center;
      width: 28px; height: 28px; margin-left: 4px;
      border: 0; border-radius: 6px;
      background: none; color: inherit; font-size: 18px; cursor: pointer;
    }
    #add:hover { background: #33312e; }
    input {
      width: 140px; height: 24px; padding: 0 6px;
      border: 1px solid #d97757; border-radius: 4px; outline: none;
      background: #1f1e1d; color: #fff; font: inherit;
    }
    #new-input { align-self: center; margin-left: 4px; }
    /* Aba filha: mais estreita, colada à pai, com a cor da conta embaixo. */
    .tab.child {
      min-width: 70px; max-width: 180px; height: 28px; padding: 0 4px 0 10px;
      font-size: 12px; box-shadow: inset 0 -2px 0 var(--parent-color);
    }
    .tab.child .dot { width: 6px; height: 6px; }
    .tab.child .dot.loading { width: 8px; height: 8px; }
    .tab .close {
      flex: none; width: 18px; height: 18px; padding: 0;
      border: 0; border-radius: 4px; background: none;
      color: inherit; font-size: 14px; line-height: 18px; cursor: pointer; opacity: .6;
    }
    .tab .close:hover { background: #4a4743; opacity: 1; }
    .child-input { align-self: center; width: 240px; }
    .tab .lock { flex: none; font-size: 11px; opacity: .8; }
    /* 🤖 conta liberada: desbotado = servidor desligado; normal = ligado;
       fundo verde = Claude Code usando agora. */
    .tab .mcp { flex: none; font-size: 11px; line-height: 16px; padding: 0 2px; border-radius: 4px; opacity: .3; filter: grayscale(1); }
    .tab .mcp.on { opacity: 1; filter: none; }
    .tab .mcp.live { background: #3f8f4f; box-shadow: 0 0 0 1px #6fcf7f; }
    #panel {
      position: absolute; inset: 40px 0 0 0;
      display: flex; align-items: center; justify-content: center;
    }
    #panel[hidden] { display: none; }
    .pin-box {
      display: flex; flex-direction: column; gap: 10px; width: 280px;
      padding: 24px; border-radius: 12px; background: #2a2826; text-align: center;
      user-select: text;
    }
    .pin-box .icon { font-size: 28px; }
    .pin-box h2 { margin: 0; font-size: 16px; font-weight: 600; color: #fff; }
    .pin-box p { margin: 0; font-size: 12px; opacity: .75; }
    .pin-box input { width: 100%; height: 32px; font-size: 15px; text-align: center; letter-spacing: 2px; }
    .pin-box .error { min-height: 16px; color: #e5826b; font-size: 12px; }
    .pin-box .buttons { display: flex; gap: 8px; }
    .pin-box button {
      flex: 1; height: 30px; border: 0; border-radius: 6px; cursor: pointer;
      font: inherit; background: #3a3835; color: inherit;
    }
    .pin-box button.primary { background: #d97757; color: #fff; }
    .pin-box button:disabled { opacity: .5; cursor: default; }
    /* Espelho da aba do Claude Code: quadros ao vivo; cliques e teclas vão para a aba. */
    #panel.mirror { align-items: stretch; justify-content: stretch; background: #fff; outline: none; }
    #panel.mirror img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: top left; cursor: default; user-select: none; -webkit-user-drag: none; }
    #panel.mirror .mirror-input {
      position: absolute; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0;
      opacity: 0; resize: none; pointer-events: none;
    }
    #panel.mirror .badge {
      position: absolute; top: 8px; right: 12px; padding: 4px 10px; border-radius: 12px;
      background: rgba(31,30,29,.85); color: #fff; font-size: 12px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="bar"></div>
  <div id="panel" hidden></div>
  <script src="tabbar.js"></script>
</body>
</html>
